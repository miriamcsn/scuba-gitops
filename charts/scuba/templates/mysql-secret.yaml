# Secret em texto puro, apenas para a demo (mesmas credenciais do compose.yml).
# Em produção: Sealed Secrets ou External Secrets, sem senha legível no Git.
{{- if .Values.mysql.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-mysql
  labels:
    {{- include "scuba.labels" . | nindent 4 }}
    app.kubernetes.io/component: database
type: Opaque
stringData:
  mysql-root-password: rootpw
  mysql-user: divelog
  mysql-password: divelog
  mysql-database: divelog
{{- end }}

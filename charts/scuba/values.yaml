# Valores padrão do chart. Cada ambiente sobrescreve o que precisa em
# envs/<ambiente>/values.yaml (registry e tags das imagens, no mínimo).

image:
  # Registry das imagens: projeto "scuba" no Harbor do NKP. Ex.: harbor.exemplo.local/scuba
  registry: ""
  pullPolicy: IfNotPresent

# Se o projeto do Harbor for privado, crie um Secret docker-registry no namespace
# e liste aqui. Ex.: [{name: harbor-pull}]
imagePullSecrets: []

# Backend: FastAPI + MySQL
backend:
  image:
    repository: scuba-backend
    tag: ""            # definida pelo CI em envs/<ambiente>/values.yaml
  replicaCount: 1
  port: 8000
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  podSecurityContext:
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
  securityContext: {}

# Frontend: nginx sem root servindo o HTML e fazendo proxy de /api para o backend
frontend:
  image:
    repository: scuba-frontend
    tag: ""            # definida pelo CI em envs/<ambiente>/values.yaml
  replicaCount: 2
  port: 8080           # porta do container (nginx sem root)
  servicePort: 80      # porta do Service, usada pelo Ingress
  resources:
    requests:
      cpu: 50m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 128Mi
  podSecurityContext: {}
  securityContext: {}

# Ingress no Traefik do NKP. Sem host: o app abre direto pelo IP do LoadBalancer.
ingress:
  enabled: true
  className: kommander-traefik
  host: ""
  path: /
  pathType: Prefix

# MySQL em StatefulSet, com volume persistente no Nutanix CSI.
# As credenciais ficam em templates/mysql-secret.yaml e templates/backend-db-secret.yaml.
mysql:
  enabled: true
  image:
    repository: mysql
    tag: "8.4"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 750m
      memory: 1Gi
  podSecurityContext:
    fsGroup: 999
  securityContext: {}
  persistence:
    storageClass: nutanix-volume
    size: 8Gi
